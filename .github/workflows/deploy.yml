name: Deploy Pingui Alert

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: actions_env

    steps:
      - name: 📥 Clone from repo
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'pnpm'

      - name: 📦 Install deps
        run: pnpm install

      - name: 🧪 Run tests
        run: pnpm test

      - name: 🏗️ Build
        run: pnpm run build

      - name: 🚀 Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/pingui-alert
            git pull --ff-only origin main
            export NVM_DIR="$HOME/.nvm"
            NODE_BIN="$(ls -d "$NVM_DIR"/versions/node/*/bin 2>/dev/null | sort -V | tail -1)"
            export PATH="$NODE_BIN:$HOME/.local/share/pnpm/bin:$PATH"
            pnpm install --frozen-lockfile
            pnpm migration:up
            pnpm run build
            pm2 restart ecosystem.config.cjs --env production --update-env || pm2 start ecosystem.config.cjs --env production
            pm2 save
