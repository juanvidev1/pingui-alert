name: Deploy Pingui Alert

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: 📥 Clone from repo
        uses: actions/checkout@v4

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'pnpm'

      - name: 📦 Install deps
        run: pnpm install

      - name: 🧪 Run tests
        run: pnpm test

      - name: 🏗️ Build
        run: pnpm run build

      - name: 🚀 Notificar deploy (GitHub Deployments → webhook)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = context.ref.replace('refs/heads/', '');

            const deployment = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
            });
            console.log(`Deployment #${deployment.data.id} creado para ${ref}`);

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.data.id,
              state: 'success',
              description: 'Servidor notificado vía webhook',
            });
            console.log('deployment_status success publicado → el webhook correrá deploy-pingui-alert.sh');